[package]
name = "anecho-device"
description = "Measurement device abstraction for Anecho: trait, sound-card (cpal) and QA40x backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpal", "qa40x"]
# QuantAsylum QA402/QA403 through qa40x-driver (native USB, factory calibration).
qa40x = ["dep:qa40x-driver"]
# Also expose the embedded QA40x simulator (hardware-free tests and demos).
qa40x-sim = ["qa40x", "qa40x-driver/sim"]
# Generic sound cards through cpal (WASAPI shared mode, Core Audio, ALSA).
cpal = ["dep:cpal"]
# Steinberg ASIO on Windows. Needs the ASIO SDK (GPLv3+ since Oct 2025) and LLVM at build
# time: set CPAL_ASIO_DIR. See cpal's README.
asio = ["cpal", "cpal/asio"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
cpal = { version = "0.18", optional = true }
qa40x-driver = { path = "../../../drivers/qa40x-driver", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
anecho-dsp.workspace = true
env_logger = "0.11"

[lints]
workspace = true

[[example]]
name = "qa40x_probe"
required-features = ["qa40x"]

[[example]]
name = "qa40x_relay_matrix"
required-features = ["qa40x"]

[[example]]
name = "qa40x_sim_profile"
required-features = ["qa40x-sim"]

[[example]]
name = "qa40x_thdn_breakdown"
required-features = ["qa40x"]

[[example]]
name = "qa40x_raw_dump"
required-features = ["qa40x"]

[[example]]
name = "qa40x_driver_insertion"
required-features = ["qa40x"]

[[example]]
name = "qa40x_chunk_profile"
required-features = ["qa40x"]

[[example]]
name = "qa40x_residual"
required-features = ["qa40x"]

[[example]]
name = "qa40x_channel_check"
required-features = ["qa40x"]

[[example]]
name = "qa40x_restart_probe"
required-features = ["qa40x"]

[[example]]
name = "qa40x_recover_probe"
required-features = ["qa40x"]
