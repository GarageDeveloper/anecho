[package]
name = "anecho-device"
description = "Measurement device abstraction for Anecho: trait, sound-card (cpal) and QA40x backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpal"]
# Generic sound cards through cpal (WASAPI shared mode, Core Audio, ALSA).
cpal = ["dep:cpal"]
# Steinberg ASIO on Windows. Needs the ASIO SDK (GPLv3+ since Oct 2025) and LLVM at build
# time: set CPAL_ASIO_DIR. See cpal's README.
asio = ["cpal", "cpal/asio"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
cpal = { version = "0.18", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
